name: Inputs Practise
on:
  push:
    branches:
       - DEV
  workflow_dispatch:
    inputs:
      Application:
        description: "Please Select your Application"
        required: true
        type: choice
        options:
          - PhonePe
          - CRED
          - Paytm
          - GooglePay
          - ApplePay
      Environment:
        description: "Please select your input"
        type: choice
        required: true
        options:
          - DEV
          - SIT
          - UAT
          - SVP
          - PROD
      DR:
        description: "You want it to Deploy on DR Server Also ?"
        type: boolean
        default: false
        required: true
env:
  Name: "Murali"
  Branch: ${{ inputs.Environment }}
        
jobs:
  Branch-Validation:
    runs-on: ubuntu-22.04
    steps:
      - name: Branch Approval
        if: ${{ env.Branch != 'DEV' || env.Branch != 'SIT' }}
        run:
          echo "Manual Approval is  Required for the selected Branch ${{ env.Branch }}"
        
  Build:
    runs-on: ubuntu-22.04
    steps:
      - name: Selected Application
        run: |
          echo "Hey ${{ env.Name }}, We are going to deploy on ${{ inputs.Application }} Application"
          
      - name: Selected Environment
        run: echo "The Selected Application is ${{ inputs.Application }} and we are going to deploy it to ${{ inputs.Environment }} Environment"
      
      - name: DR Server
        if: ${{ inputs.DR }}
        run: echo "Application is Deployed to DR"
        
      - name: Printing Current Branch
        run: echo "Current Branch is ${{ github.ref }}"
        
      - name: Skipping DR Server
        if: ${{ inputs.DR == false }}
        run: echo "The Application is not deployed to DR."
  Shell:
    needs: Build
    runs-on: ubuntu-22.04
    steps:
     - name: checkout code
       uses: actions/checkout@v4
     - name: Permission to execute script
       run: |
         ls -la
         chmod +x ./Scripts/Welcome.sh
         ls -la
         ./Scripts/Welcome.sh
