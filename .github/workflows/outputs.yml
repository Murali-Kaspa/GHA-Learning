name: output-practise
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: step-level-output
        id: version
        run: echo "app_version=0.1.10">>$GITHUB_OUTPUT
      - name: Display Version
        run: echo "Current Version is ${{ steps.version.outputs.app_version }}"
